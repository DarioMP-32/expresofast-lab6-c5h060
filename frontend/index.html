<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast · Tablero</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="topbar">
        <div class="brand">
            <span class="brand__mark">ExpresoFast</span>
            <span class="brand__tag"> - seguimiento de envíos</span>
        </div>
        <div class="topbar__stats" id="statsResumen" aria-live="polite">
            <span class="stat-chip">Pendiente <strong id="countPendiente">0</strong></span>
            <span class="stat-chip">En tránsito <strong id="countTransito">0</strong></span>
            <span class="stat-chip">Entregado <strong id="countEntregado">0</strong></span>
        </div>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <nav class="filtros" aria-label="Filtros de estado de envío">
                <h2 class="sidebar__title">Filtrar por estado</h2>
                <button class="filtro-tab is-active" data-filtro="TODOS" type="button">Todos</button>
                <button class="filtro-tab" data-filtro="PENDIENTE" type="button">Pendiente</button>
                <button class="filtro-tab" data-filtro="EN_TRANSITO" type="button">En tránsito</button>
                <button class="filtro-tab" data-filtro="ENTREGADO" type="button">Entregado</button>
            </nav>

            <section class="intake" aria-labelledby="intakeTitulo">
                <h2 class="sidebar__title" id="intakeTitulo">Registrar envío</h2>
                <form id="formEnvio" class="form-envio" novalidate>
                    <label for="codigoRastreo">Código de rastreo</label>
                    <input type="text" id="codigoRastreo" name="codigoRastreo" placeholder="0001" required>

                    <label for="direccionDestino">Dirección destino</label>
                    <input type="text" id="direccionDestino" name="direccionDestino" placeholder="Cartago"
                        required>

                    <div class="form-row">
                        <div>
                            <label for="pesoKg">Peso (kg)</label>
                            <input type="number" id="pesoKg" name="pesoKg" step="0.01" min="0.01" required>
                        </div>
                        <div>
                            <label for="costo">Costo (₡)</label>
                            <input type="number" id="costo" name="costo" step="0.01" min="0" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label for="vehiculoId">ID vehículo</label>
                            <input type="number" id="vehiculoId" name="vehiculoId" min="1" required>
                        </div>
                        <div>
                            <label for="conductorId">ID conductor</label>
                            <input type="number" id="conductorId" name="conductorId" min="1" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Registrar envío</button>
                    <p class="form-feedback" id="formFeedback" role="status"></p>
                </form>
            </section>
        </aside>

        <main class="board">
            <section class="board__header">
                <h1>Envíos activos</h1>
                <p id="boardSubtitulo">Cargando manifiesto de envíos…</p>
            </section>

            <section class="board__grid" id="gridEnvios" aria-live="polite">
            </section>
        </main>

    </div>

    <script src="app.js"></script>
</body>

</html>
